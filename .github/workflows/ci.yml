name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src skills/nextx/scripts/bootstrap.py
      - name: Validate NextX Skill semantics
        run: python scripts/validate_skill.py
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Verify structured installer error
        shell: bash
        run: |
          output="$(python skills/nextx/scripts/bootstrap.py --not-an-option || true)"
          python -c 'import json,sys; assert json.loads(sys.stdin.read())["ok"] is False' <<< "$output"
